# Settings for scripts/lint-gate.sh (sourced by bash). Setup never overwrites this file.

# The project's own lint command (e.g. 'make lint', 'pnpm lint'), run in addition to the
# built-in linters. Leave empty if there is none.
LINT_CMD='make lint'

# Space-separated languages (go python rust js shell) or file extensions without the dot
# (vue sql ...) that LINT_CMD already lints: their built-in linter is skipped and they are
# not reported as unsupported.
# make lint runs go vet + golangci-lint, and ESLint in ui/ and e2e/ (where all JS/TS lives).
COVERED='go js'

# Space-separated file extensions without the dot that are not code (data, assets, generated
# files) and need no linter. Never use this for real source code.
NOT_CODE=''
