# Settings for scripts/lint-gate.sh (sourced by bash). Setup never overwrites this file.

# Built-in linters (golangci-lint, ruff, cargo clippy, oxlint, shellcheck) always run, the same
# in every project. The two settings below exist only for file types they don't cover.

# A command that lints the file types listed in COVERED. Leave empty if there are none.
LINT_CMD=''

# Space-separated file extensions without the dot (vue sql ...) that LINT_CMD lints, so they
# are not reported as unsupported. Never list a built-in language here.
COVERED=''

# Space-separated file extensions without the dot that are not code (data, assets, generated
# files) and need no linter. Never use this for real source code.
NOT_CODE=''
