# Settings for scripts/pre-commit-gate.sh (sourced by bash). Setup never overwrites this file.

# Built-in tools (gofmt/golangci-lint, ruff, rustfmt/clippy, prettier/ESLint, shfmt/shellcheck)
# always run. The settings below exist only for file types they don't cover.

# A command that lints the file types listed in COVERED. The staged files of those types are
# appended as arguments, e.g. LINT_CMD='npx eslint'. Leave empty if there are none.
LINT_CMD=''

# Space-separated file extensions without the dot (vue java ...) that LINT_CMD lints.
COVERED=''

# Space-separated file extensions without the dot that are not code (data, assets, generated
# files) and need no linter. Never use this for real source code.
NOT_CODE=''
