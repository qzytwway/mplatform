{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mplatform.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mplatform.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.jwtSecret }}
  JWT_SECRET: {{ .Values.jwtSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.encryptKey }}
  MPLATFORM_ENCRYPT_KEY: {{ .Values.encryptKey | b64enc | quote }}
  {{- end }}
  {{- if and (ne .Values.db.type "sqlite") (not (include "mplatform.postgresql.enabled" .)) }}
  DB_TYPE: {{ .Values.db.type | b64enc | quote }}
  DB_DSN: {{ required "db.dsn is required for an external database (db.type mysql, or a DSN in secret.existingSecret with secret.create=false)" .Values.db.dsn | b64enc | quote }}
  {{- end }}
{{- end }}